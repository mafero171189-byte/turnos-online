<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turno Fácil Pro</title>
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://www.gstatic.com">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f5f7ff', 100: '#ebf0fe', 200: '#dce4fe', 300: '#c3d1fc', 400: '#9db4f9', 500: '#768df4', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81' },
                        neutral: tailwind.colors.slate,
                    },
                    borderRadius: { '3xl': '1.5rem', '4xl': '2rem' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        @keyframes renewPulse { 0%,100%{ box-shadow:0 0 0 0 rgba(245,158,11,0.55); } 50%{ box-shadow:0 0 0 8px rgba(245,158,11,0); } }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }
        input[type="time"]::-webkit-calendar-picker-indicator,
        input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; }
        
        :root { --custom-color: #4f46e5; }
        .custom-bg { background-color: var(--custom-color) !important; color: white !important;}
        .custom-text { color: var(--custom-color) !important; }
        .custom-border { border-color: var(--custom-color) !important; }

        /* ========== SPLASH SCREEN ========== */
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Estrella flotante */
        @keyframes floatStar {
            0%   { transform: translateY(0px) scale(1);   opacity: 0.15; }
            50%  { transform: translateY(-18px) scale(1.1); opacity: 0.35; }
            100% { transform: translateY(0px) scale(1);   opacity: 0.15; }
        }
        /* Logo bouncing */
        @keyframes logoBounce {
            0%,100% { transform: translateY(0px); }
            30%     { transform: translateY(-12px); }
            60%     { transform: translateY(-5px); }
        }
        /* Pulso glow detrás del logo */
        @keyframes glowPulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(99,102,241,0.5); }
            50%     { box-shadow: 0 0 40px 20px rgba(99,102,241,0.15); }
        }
        /* Aparición suave del texto */
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        /* Parpadeo del subtítulo */
        @keyframes blinkDots {
            0%,100% { opacity: 1; } 50% { opacity: 0.3; }
        }

        /* ========== LOADING SCREEN (fondo reemplazado) ========== */
        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes orbFloat1 {
            0%,100% { transform: translate(0,0) scale(1); }
            33%     { transform: translate(30px,-40px) scale(1.1); }
            66%     { transform: translate(-20px,20px) scale(0.95); }
        }
        @keyframes orbFloat2 {
            0%,100% { transform: translate(0,0) scale(1); }
            33%     { transform: translate(-25px,35px) scale(1.05); }
            66%     { transform: translate(40px,-20px) scale(0.9); }
        }
        @keyframes orbFloat3 {
            0%,100% { transform: translate(0,0) scale(1); }
            50%     { transform: translate(15px,50px) scale(1.15); }
        }
        @keyframes loaderRing {
            0%   { stroke-dashoffset: 220; opacity: 0.3; }
            50%  { stroke-dashoffset: 60;  opacity: 1; }
            100% { stroke-dashoffset: 220; opacity: 0.3; }
        }
        @keyframes loaderDot {
            0%,100% { transform: scale(0.6); opacity: 0.4; }
            50%     { transform: scale(1.2); opacity: 1; }
        }
    </style>
</head>
<body class="bg-brand-50 text-neutral-900 overflow-x-hidden">

    <!-- Loader visible ANTES de que Babel/React arranquen (HTML puro, sin JS) -->
    <div id="pre-loader" style="
        position:fixed;inset:0;z-index:9999;
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        background:linear-gradient(135deg,#eef2ff 0%,#f0f4ff 50%,#eef2ff 100%);
        font-family:'Inter',sans-serif;
    ">
        <div style="font-size:56px;margin-bottom:20px;">📅</div>
        <h2 style="color:#312e81;font-weight:700;font-size:22px;margin:0 0 6px 0;">Turno Fácil Pro</h2>
        <p style="color:#6366f1;font-size:13px;margin:0 0 28px 0;">Preparando todo para vos...</p>
        <div style="display:flex;gap:8px;">
            <div style="width:10px;height:10px;border-radius:50%;background:#4f46e5;animation:ldot 1.2s ease-in-out 0s infinite;"></div>
            <div style="width:10px;height:10px;border-radius:50%;background:#6366f1;animation:ldot 1.2s ease-in-out 0.2s infinite;"></div>
            <div style="width:10px;height:10px;border-radius:50%;background:#818cf8;animation:ldot 1.2s ease-in-out 0.4s infinite;"></div>
        </div>
        <style>
            @keyframes ldot {
                0%,80%,100%{transform:scale(0.7);opacity:0.5}
                40%{transform:scale(1.2);opacity:1}
            }
        </style>
    </div>

    <!-- Contenedor de React -->
    <div id="root"></div>
